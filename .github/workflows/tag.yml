name: Tag release

# Trunk-based release: every push to master runs semantic-release, which parses the Conventional Commit messages since
# the last release (see pr-title.yml and CLAUDE.md) to decide whether and what to release. When it does:
#   1. @semantic-release/npm publishes @keletes/svmq (prebuilt N-API binaries for linux-x64, linux-arm64, darwin-arm64 and
#      darwin-x64 under prebuilds/, plus sources + binding.gyp for the fallback compile) to GitHub Packages
#   2. the vX.Y.Z tag is created and a GitHub Release is published
#
# No release commit is pushed back (the protected master rejects it); package.json's version is the placeholder
# 0.0.0-development. The package publish uses the job's GITHUB_TOKEN; tag and release use the GitHub App token.
on:
  push:
    branches: [master]
  # Manual re-run of a release (e.g. after a failed or stuck run); semantic-release only releases from master and only when there are unreleased feat/fix commits, so a manual run is otherwise a no-op.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # One N-API binary per platform (works on every supported Node major); uploaded for the release job to bundle.
  prebuild:
    name: prebuild ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Linux targets build inside an old-glibc image (bullseye: glibc 2.31, GCC 10 libstdc++) so the binary also loads on
    # bookworm and newer; an empty `container` (macOS) runs on the host.
    container: ${{ matrix.container }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64, container: 'node:22-bullseye' }
          - { os: ubuntu-24.04-arm, target: linux-arm64, container: 'node:22-bullseye' }
          - { os: macos-14, target: darwin-arm64, container: '' }
          - { os: macos-15-intel, target: darwin-x64, container: '' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      # --ignore-scripts: do not compile in `install`; `yarn prebuild` below is the one build.
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Build prebuild
        run: yarn prebuild

      - name: Smoke test the prebuild
        run: node -e "require('node-gyp-build')(process.cwd())" && test -n "$(ls prebuilds/${{ matrix.target }}/*.node)"

      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ matrix.target }}
          path: prebuilds/
          if-no-files-found: error

  release:
    needs: prebuild
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: keletes
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          registry-url: https://npm.pkg.github.com
          scope: '@keletes'

      # Public repo and no private packages: no PACKAGES_READ_PAT step.
      # --ignore-scripts: the release job needs no addon; the published tarball gets the prebuilds below.
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      # Every matrix artifact lands in prebuilds/<platform>-<arch>/; `files` in package.json ships the folder.
      - name: Download prebuilds
        uses: actions/download-artifact@v4
        with:
          pattern: prebuilds-*
          path: prebuilds
          merge-multiple: true

      - name: Check all four prebuilds are present
        run: |
          for p in linux-x64 linux-arm64 darwin-arm64 darwin-x64; do
            ls prebuilds/$p/*.node
          done

      - name: Release
        run: yarn semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
