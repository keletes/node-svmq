name: Verify

# PR gate for master. Required status check (branch protection): `test`.
# Builds the native addon on the runner (ubuntu only; the four-platform prebuilds are built by tag.yml), type-checks
# index.d.ts and runs the jasmine suite against real System V queues.

on:
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22: semantic-release and its plugins (devDependencies) need it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      # `install` runs node-gyp-build, which compiles the addon here because no prebuild exists in a fresh checkout
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify (type test + specs)
        run: yarn verify
